name: Create development branch

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: "作成する開発ブランチ名 例: feature/login-api"
        required: true
        type: string
      source_branch:
        description: "作成元ブランチ"
        required: true
        default: "main"
        type: string

permissions:
  contents: write
  issues: write

jobs:
  approval:
    name: Approval
    runs-on: ubuntu-latest
    environment: branch-creation-approval

    steps:
      - name: Show request
        run: |
          echo "依頼者: ${{ github.actor }}"
          echo "作成ブランチ: ${{ inputs.branch_name }}"
          echo "作成元ブランチ: ${{ inputs.source_branch }}"

  create-branch:
    name: Create branch
    needs: approval
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}

      - name: Validate branch name
        run: |
          BRANCH="${{ inputs.branch_name }}"

          if [[ "$BRANCH" =~ [[:space:]] ]]; then
            echo "ブランチ名に空白は使えません"
            exit 1
          fi

          if [[ "$BRANCH" == "main" || "$BRANCH" == "master" ]]; then
            echo "main/master は作成対象にできません"
            exit 1
          fi

      - name: Create branch
        run: |
          git fetch origin

          if git ls-remote --exit-code --heads origin "${{ inputs.branch_name }}"; then
            echo "ブランチは既に存在します: ${{ inputs.branch_name }}"
            exit 1
          fi

          git checkout -b "${{ inputs.branch_name }}"
          git push origin "${{ inputs.branch_name }}"

      - name: Notify requester by issue
        uses: actions/github-script@v7
        with:
          script: |
            const requester = context.actor;
            const branch = `${{ inputs.branch_name }}`;
            const source = `${{ inputs.source_branch }}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `開発ブランチ作成完了: ${branch}`,
              body: [
                `@${requester}`,
                ``,
                `開発ブランチを作成しました。`,
                ``,
                `- ブランチ: \`${branch}\``,
                `- 作成元: \`${source}\``,
                `- 実行URL: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              ].join('\n')
            });